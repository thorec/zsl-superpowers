[tool.ruff]
line-length = 104
# Skill scripts run via `#!/usr/bin/env python3`, which is 3.9 on stock macOS —
# keep pyupgrade from suggesting newer-only APIs (e.g. datetime.UTC is 3.11+).
target-version = "py39"

[tool.basedpyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # long lines — formatter handles what it can; remaining cases are string literals
]
